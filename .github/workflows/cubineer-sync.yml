name: Cubineer upstream sync

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cubineer-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-regression:
    name: CPU regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cubineer/python/requirements.txt
      - name: Install Python test dependencies
        run: |
          python -m pip install --requirement cubineer/python/requirements.txt pytest==9.1.1
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run Cubineer CPU regression suite
        env:
          PYTHON: python
        run: cubineer/scripts/check-upstream-sync
